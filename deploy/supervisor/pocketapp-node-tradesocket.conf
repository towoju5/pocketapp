; Keeps node-services/tradesocket running permanently — the socket.io relay
; for trade placement (POST /internal/trades) and settlement push
; (POST /internal/push/trade-updated, called from
; TradeSettlementService::pushToTradeSocket). Never touches the DB or wallet
; directly; every trade still goes through Laravel's normal
; TradePlacementService. See node-services/README.md for the full picture.
;
; Requires node-services/.env to exist first (copy from .env.example, fill
; in REALTIME_JWT_SECRET/INTERNAL_API_SECRET to match Laravel's own .env) and
; `npm install` to have been run in node-services/. Also requires Laravel's
; own TRADESOCKET_INTERNAL_URL (.env) to point at this program's port before
; the settlement-push side channel does anything — it safely no-ops until
; then, so starting this program alone is not enough to activate that leg.
;
; Install:
;   sudo cp deploy/supervisor/pocketapp-node-tradesocket.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pocketapp-node-tradesocket
;
; Check status / tail logs:
;   sudo supervisorctl status pocketapp-node-tradesocket
;   tail -f /var/www/pocketapp/storage/logs/node-tradesocket.log

[program:pocketapp-node-tradesocket]
; Adjust to the actual node binary path for the deploy environment (e.g. an
; nvm-managed path) if this doesn't resolve under Supervisor's minimal PATH.
; directory (not tradesocket/) matters: dotenv resolves .env relative to cwd,
; and node-services/.env lives one level up from this script.
command=node tradesocket/index.js
directory=/var/www/pocketapp/node-services
autostart=true
autorestart=true
startsecs=5
startretries=100
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pocketapp/storage/logs/node-tradesocket.log
stopwaitsecs=15
stopsignal=TERM
