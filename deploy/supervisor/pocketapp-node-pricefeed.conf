; Keeps node-services/pricefeed running permanently — the Node port of
; ticks:stream-brokeret-ui (see pocketapp-brokeret-ui-stream.conf) for
; base_url/ui's live-feed/chart. Connects to Brokeret directly and writes
; into the SAME Redis namespace (brokeret:*) the PHP daemon uses, then
; broadcasts to browsers over its own plain WebSocket server instead of
; Ably/Reverb. See node-services/README.md for the full picture.
;
; IMPORTANT — only one of pocketapp-brokeret-ui-stream (PHP) and this
; program should be running at a time; both are alternative writers to the
; same Redis keys. Running both isn't unsafe (writes are idempotent, same
; shape) but doubles the Brokeret connection and broadcast traffic. Cutover:
;   sudo supervisorctl stop pocketapp-brokeret-ui-stream
;   sudo supervisorctl start pocketapp-node-pricefeed
; Rollback is the same two commands in reverse — pocketapp-brokeret-ui-stream
; is left installed (not removed) specifically so this stays a one-flag-flip
; operation, not a redeploy.
;
; Requires node-services/.env to exist first (copy from .env.example, fill
; in REALTIME_JWT_SECRET/INTERNAL_API_SECRET to match Laravel's own .env) and
; `npm install` to have been run in node-services/.
;
; Install:
;   sudo cp deploy/supervisor/pocketapp-node-pricefeed.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pocketapp-node-pricefeed
;
; Check status / tail logs:
;   sudo supervisorctl status pocketapp-node-pricefeed
;   tail -f /var/www/pocketapp/storage/logs/node-pricefeed.log

[program:pocketapp-node-pricefeed]
; Adjust to the actual node binary path for the deploy environment (e.g. an
; nvm-managed path) if this doesn't resolve under Supervisor's minimal PATH.
; directory (not pricefeed/) matters: dotenv resolves .env relative to cwd,
; and node-services/.env lives one level up from this script.
command=node pricefeed/index.js
directory=/var/www/pocketapp/node-services
autostart=true
autorestart=true
startsecs=5
startretries=100
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pocketapp/storage/logs/node-pricefeed.log
stopwaitsecs=15
stopsignal=TERM
