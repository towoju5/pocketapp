; Keeps the Brokeret price stream running permanently (php artisan
; ticks:stream-brokeret).
;
; This SUPERSEDES websockets-setup/ws.py as the price source: Brokeret's
; feed (wss://feed.brokeret.com/ws) isn't behind Cloudflare, so this app
; connects to it directly as a plain WebSocket client from the backend —
; no Playwright/headless-Chrome workaround needed. It writes ticks into the
; exact same Redis keys ws.py used (ticks:{symbol} streams +
; latest_tick:{symbol}, see PriceFeedService), so
; pocketapp-redis-tick-bridge.conf (ticks:bridge-redis) keeps working
; completely unchanged — it tails those Redis streams regardless of which
; process wrote them, and rebroadcasts over Reverb for the chart/trading
; frontend.
;
; ws.py's code is left in place (not deleted) in case that pipeline is ever
; needed again. Once this process is confirmed running and populating
; Redis, stop ws.py (it isn't managed by Supervisor — see its own docblock
; — just stop whatever is running it) so the two don't double-write the
; same keys.
;
; Install:
;   sudo cp deploy/supervisor/pocketapp-brokeret-stream.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pocketapp-brokeret-stream
;
; Check status / tail logs:
;   sudo supervisorctl status pocketapp-brokeret-stream
;   tail -f /var/www/pocketapp/storage/logs/brokeret-stream.log

[program:pocketapp-brokeret-stream]
command=php /var/www/pocketapp/artisan ticks:stream-brokeret
directory=/var/www/pocketapp
autostart=true
autorestart=true
startsecs=5
startretries=100
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pocketapp/storage/logs/brokeret-stream.log
stopwaitsecs=15
stopsignal=TERM
