; Keeps the Redis->Reverb tick bridge running permanently (php artisan
; ticks:bridge-redis). This is the current price pipeline's second half:
;
;   The price source writes ticks straight into Redis (ticks:{symbol}
;   streams + latest_tick:{symbol}) with no knowledge of this bridge process
;   — this process tails those Redis streams and rebroadcasts new ticks as
;   AssetPriceBatchUpdated over Reverb (see pocketapp-reverb.conf — must
;   also be running), which is what chart.js/ChartManager._initBroadcast
;   already listens for. That decoupling means this file needs NO changes
;   no matter which of the following is currently the writer:
;
;   - pocketapp-brokeret-stream.conf (php artisan ticks:stream-brokeret,
;     current default) — connects to Brokeret's feed directly from this
;     app (not behind Cloudflare, so no browser automation needed).
;   - websockets-setup/ws.py (Python/Playwright, SUPERSEDED, run
;     separately, NOT under this Supervisor pool) — subscribed to iqcent's
;     WS feed directly. Left in place in case it's ever needed again.
;
; Without this process: PriceFeedService (app/Services/PriceFeedService.php)
; still reads prices/history straight from Redis fine for trade placement and
; settlement, but no chart will move live for anyone (until the next tab
; reload triggers a fresh history backfill).
;
; This supersedes pocketapp-ticker-collector.conf (the old headless-Chrome
; Panther collector) as the price source — that pool should be stopped
; (`sudo supervisorctl stop pocketapp-ticker-collector:*`) once ws.py is
; confirmed running and writing to the same Redis instance configured below
; in REDIS_HOST/REDIS_PORT/REDIS_DB (must match websockets-setup/ws.py's
; REDIS_HOST/REDIS_PORT/REDIS_DB constants and this app's .env). Its code is
; left in place (not deleted) in case that pipeline is ever needed again.
;
; Install:
;   sudo cp deploy/supervisor/pocketapp-redis-tick-bridge.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pocketapp-redis-tick-bridge
;
; Check status / tail logs:
;   sudo supervisorctl status pocketapp-redis-tick-bridge
;   tail -f /var/www/pocketapp/storage/logs/redis-tick-bridge.log

[program:pocketapp-redis-tick-bridge]
command=php /var/www/pocketapp/artisan ticks:bridge-redis
directory=/var/www/pocketapp
autostart=true
autorestart=true
startsecs=5
startretries=100
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pocketapp/storage/logs/redis-tick-bridge.log
stopwaitsecs=15
stopsignal=TERM
