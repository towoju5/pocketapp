; Keeps base_url/ui's independent Brokeret price feed running permanently
; (php artisan ticks:stream-brokeret-ui).
;
; This is a SEPARATE pipeline from pocketapp-brokeret-stream.conf (ticks:
; stream-brokeret) and pocketapp-redis-tick-bridge.conf: it connects to
; Brokeret directly, persists every symbol it streams (not just ones in the
; Assets table) under its own Redis namespace (brokeret:*, via
; BrokeretFeedService), and broadcasts immediately on the 'brokeret-feed'
; channel (App\Events\BrokeretTicksUpdated) — no queue worker, no shared
; code with the main dashboard's iqcent-based pipeline. That pipeline is
; untouched and keeps serving __dash.blade.php regardless of whether this
; process is running.
;
; Install:
;   sudo cp deploy/supervisor/pocketapp-brokeret-ui-stream.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pocketapp-brokeret-ui-stream
;
; Check status / tail logs:
;   sudo supervisorctl status pocketapp-brokeret-ui-stream
;   tail -f /var/www/pocketapp/storage/logs/brokeret-ui-stream.log

[program:pocketapp-brokeret-ui-stream]
command=php /var/www/pocketapp/artisan ticks:stream-brokeret-ui
directory=/var/www/pocketapp
autostart=true
autorestart=true
startsecs=5
startretries=100
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pocketapp/storage/logs/brokeret-ui-stream.log
stopwaitsecs=15
stopsignal=TERM
